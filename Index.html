<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://script.google.com/macros/s/AKfycbwdMKotp4ztXhxq0vTC1_wSXAlS28oJK5BO5ftEsR35/dev">
  <title>Arsip Digital MPDM</title>
  <style>
    body { background-color: #f8f9fa; }
    .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .header-title { color: #0d6efd; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card p-4">
          <h3 class="text-center header-title mb-4">Arsip Digital MPDM-YMPBS</h3>
          
          <div id="alertBox" class="alert d-none" role="alert"></div>

          <form id="arsipForm" onsubmit="submitForm(event)">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Nomor Surat</label>
                <input type="text" class="form-control" id="nomorSurat" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Tanggal Surat</label>
                <input type="date" class="form-control" id="tanggalSurat" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Jenis Surat</label>
                <select class="form-select" id="jenisSurat" required>
                  <option value="">Pilih Jenis...</option>
                  <option value="Surat Masuk">Surat Masuk</option>
                  <option value="Surat Keluar">Surat Keluar</option>
                  <option value="Nota Dinas">Nota Dinas</option>
                  <option value="SK / Keputusan">SK / Keputusan</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Pengirim / Tujuan</label>
                <input type="text" class="form-control" id="asalTujuan" required>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Perihal</label>
              <textarea class="form-control" id="perihal" rows="3" required></textarea>
            </div>

            <div class="mb-4">
              <label class="form-label">Unggah File (PDF/Gambar)</label>
              <input class="form-control" type="file" id="fileSurat" accept=".pdf, image/*">
            </div>

            <button type="submit" class="btn btn-primary w-100" id="btnSubmit">Simpan Arsip</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    function submitForm(event) {
      event.preventDefault();
      
      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = true;
      btnSubmit.innerText = "Menyimpan... Mohon tunggu.";
      
      const fileInput = document.getElementById('fileSurat');
      const file = fileInput.files[0];
      
      const dataForm = {
        nomorSurat: document.getElementById('nomorSurat').value,
        tanggalSurat: document.getElementById('tanggalSurat').value,
        jenisSurat: document.getElementById('jenisSurat').value,
        asalTujuan: document.getElementById('asalTujuan').value,
        perihal: document.getElementById('perihal').value,
      };

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          dataForm.fileData = e.target.result.split(',')[1];
          dataForm.mimeType = file.type;
          dataForm.fileName = file.name;
          kirimKeBackend(dataForm);
        };
        reader.readAsDataURL(file);
      } else {
        kirimKeBackend(dataForm);
      }
    }

    function kirimKeBackend(dataForm) {
      google.script.run
        .withSuccessHandler(function(response) {
          tampilkanPesan(response.success, response.message);
          document.getElementById('arsipForm').reset();
          resetTombol();
        })
        .withFailureHandler(function(error) {
          tampilkanPesan(false, "Error: " + error.message);
          resetTombol();
        })
        .simpanArsip(dataForm);
    }
    
    function tampilkanPesan(sukses, pesan) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = sukses ? "alert alert-success" : "alert alert-danger";
      alertBox.innerText = pesan;
    }
    
    function resetTombol() {
      const btnSubmit = document.getElementById('btnSubmit');
      btnSubmit.disabled = false;
      btnSubmit.innerText = "Simpan Arsip";
    }
  </script>
</body>
</html>
